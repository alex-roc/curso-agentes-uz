[project]
name = "curso-agentes-uz"
version = "0.1.0"
authors = [{name = "Alex Ojeda Copa"}, {name = "Lab TecnoSocial"}]
description = "Materiales para estudiantes del curso «Más allá de los chatbots» (UNIFRANZ, 2026)"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic-ai-slim[openai,google,openrouter]==2.57.0",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "ipykernel>=6,<8",
  "rich>=13",
]

[project.scripts]
copiloto-doctor = "copiloto.doctor:main"
copiloto-configurar = "copiloto.configurar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copiloto"]

[tool.uv]
# uv descarga su propio Python 3.12 sin tocar el del sistema.
python-preference = "managed"
