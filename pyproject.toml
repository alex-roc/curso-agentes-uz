[project]
name = "curso-agentes-uz"
version = "0.1.0"
authors = [{name = "Alex Ojeda Copa"}, {name = "Lab TecnoSocial"}]
description = "Materiales para estudiantes del curso «Más allá de los chatbots» (Alex Ojeda Copa y Lab TecnoSocial)"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic-ai-slim[duckduckgo,google,mcp,openai,openrouter,web-fetch]==2.57.0",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "ipykernel>=6,<8",
  "rich>=13",
  "chromadb>=1.5,<2",
  "langchain-text-splitters>=1.1,<2",
  "mcp>=2.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utilidades"]

[tool.uv]
# uv descarga su propio Python 3.12 sin tocar el del sistema.
python-preference = "managed"
